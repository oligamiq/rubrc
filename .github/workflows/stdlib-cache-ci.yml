name: Stdlib cache validation

on:
  push:
    branches: [ci/stdlib-cache-validation]
  workflow_dispatch:
    inputs:
      mode:
        description: Validation or one-build desktop/mobile measurement preview
        type: choice
        options: [validation, mobile-baseline]
        default: validation

permissions:
  contents: read

concurrency:
  group: stdlib-cache-${{ github.ref }}
  cancel-in-progress: true

env:
  RA_TOOLCHAIN: nightly-2026-09-13
  RUSTUP_TOOLCHAIN: nightly-2026-09-13
  CARGO_BUILD_JOBS: "2"
  CARGO_INCREMENTAL: "0"
  BINARYEN_CORES: "2"
  PUPPETEER_SKIP_DOWNLOAD: "true"

defaults:
  run:
    shell: bash
    working-directory: rubrc

jobs:
  checks:
    if: github.repository == 'oligamiq/rubrc'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout validation source
        working-directory: ${{ github.workspace }}
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          git init rubrc
          git -C rubrc remote add origin https://github.com/oligamiq/rubrc.git
          git -C rubrc fetch --no-tags --depth=1 origin "$SOURCE_SHA"
          git -C rubrc checkout --detach FETCH_HEAD
      - uses: ./rubrc/.github/actions/stdlib-cache-setup
      - name: Targeted regressions
        run: |
          mkdir -p ci-logs
          bash scripts/ci/stdlib_cache.sh checks 2>&1 | tee ci-logs/checks.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stdlib-cache-checks-${{ github.run_attempt }}
          path: rubrc/ci-logs
          retention-days: 1
          if-no-files-found: ignore

  wasm-browser:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout validation source
        working-directory: ${{ github.workspace }}
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          git init rubrc
          git -C rubrc remote add origin https://github.com/oligamiq/rubrc.git
          git -C rubrc fetch --no-tags --depth=1 origin "$SOURCE_SHA"
          git -C rubrc checkout --detach FETCH_HEAD
      - uses: ./rubrc/.github/actions/stdlib-cache-setup
      - name: Install WASM tools
        run: |
          mkdir -p ci-logs
          bash scripts/ci/stdlib_cache.sh tools 2>&1 | tee ci-logs/tools.log
      - name: Build same-WASM cache and browser assets
        id: build
        run: bash scripts/ci/stdlib_cache.sh build 2>&1 | tee ci-logs/build.log
      - name: Package short-lived measurement preview
        if: inputs.mode == 'mobile-baseline'
        run: |
          printf '{"sourceSha":"%s","analyzerSha":"%s"}\n' "$GITHUB_SHA" "$(<.github/stdlib-cache-analyzer-revision)" > page/dist/__rubrc_measurement_build.json
          tar -czf "$RUNNER_TEMP/rubrc-startup-preview.tar.gz" -C page/dist .
          size=$(stat -c %s "$RUNNER_TEMP/rubrc-startup-preview.tar.gz")
          test "$size" -lt 268435456
          sha256sum "$RUNNER_TEMP/rubrc-startup-preview.tar.gz" > ci-logs/preview-sha256.txt
      - uses: actions/upload-artifact@v4
        if: inputs.mode == 'mobile-baseline' && steps.build.outcome == 'success'
        with:
          name: rubrc-startup-preview
          path: ${{ runner.temp }}/rubrc-startup-preview.tar.gz
          compression-level: 0
          retention-days: 1
      - name: Matched browser trials
        if: inputs.mode != 'mobile-baseline'
        run: bash scripts/ci/stdlib_cache.sh browser 2>&1 | tee ci-logs/browser.log
      - name: Desktop normal and constrained startup measurements
        if: inputs.mode == 'mobile-baseline'
        run: bash scripts/ci/stdlib_cache.sh measure 2>&1 | tee ci-logs/measurement.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stdlib-cache-wasm-browser-${{ github.run_attempt }}
          path: rubrc/ci-logs
          retention-days: 1
          if-no-files-found: ignore
