name: Production build (split resource test)

on:
  push:
    branches:
      - ci/production-build-wasm-opt
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-build-resource-test
  cancel-in-progress: false

env:
  BINARYEN_CORES: "2"
  CARGO_BUILD_JOBS: "2"
  CARGO_INCREMENTAL: "0"
  BINARYEN_VERSION: version_131
  BINARYEN_SHA256: b5bf1f0eaf17c63ee588ff7a5954dc8f6ce2c26989051c66f24dfe9ece3e46db

jobs:
  prebuild:
    name: VFS prebuild
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust nightly
        run: |
          rustup toolchain install nightly --profile minimal
          rustup target add wasm32-wasip1-threads --toolchain nightly

      - name: Install wasi_virt_layer
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf \
            https://github.com/oligamiq/wasi_virt_layer/releases/download/v0.6.1/wasi_virt_layer-cli-installer.sh \
            | sh
          wasi_virt_layer --version

      - name: Install Binaryen
        run: |
          curl --fail --location --retry 3 \
            --output binaryen.tar.gz \
            "https://github.com/WebAssembly/binaryen/releases/download/${BINARYEN_VERSION}/binaryen-${BINARYEN_VERSION}-x86_64-linux.tar.gz"
          echo "${BINARYEN_SHA256}  binaryen.tar.gz" | sha256sum --check -
          tar -xzf binaryen.tar.gz
          BINARYEN_DIR="$PWD/binaryen-${BINARYEN_VERSION}"
          echo "${BINARYEN_DIR}/bin" >> "$GITHUB_PATH"
          "${BINARYEN_DIR}/bin/wasm-opt" --version

      - name: Add swap headroom
        run: |
          mkdir -p ci-logs
          free -h | tee ci-logs/memory-before-swap.txt
          swapon --show | tee -a ci-logs/memory-before-swap.txt || true
          sudo fallocate -l 16G /mnt/rubrc-ci-swapfile
          sudo chmod 600 /mnt/rubrc-ci-swapfile
          sudo mkswap /mnt/rubrc-ci-swapfile
          sudo swapon /mnt/rubrc-ci-swapfile
          free -h | tee ci-logs/memory-after-swap.txt
          swapon --show | tee -a ci-logs/memory-after-swap.txt

      - name: VFS prebuild with resource monitor
        shell: bash
        run: |
          set -o pipefail
          (
            set +e
            while true; do
              echo "===== prebuild heartbeat $(date -u +%FT%TZ) ====="
              free -h
              ps -eo pid,ppid,comm,%cpu,%mem,rss --sort=-rss | sed -n '1,15p'
              sleep 60
            done
          ) > >(tee -a ci-logs/resources.log) 2>&1 &
          MONITOR_PID=$!
          trap 'free -h; swapon --show; kill "$MONITOR_PID" 2>/dev/null || true; exit 143' TERM INT
          trap 'kill "$MONITOR_PID" 2>/dev/null || true' EXIT

          set +e
          /usr/bin/time -v -o ci-logs/prebuild-time.txt \
            wasi_virt_layer prebuild \
              -p vfs \
              crates/vfs/llvm_opt.wasm \
              crates/vfs/rustc_opt.wasm \
              crates/vfs/lsp_opt.wasm \
              crates/vfs/cargo_opt.wasm \
              vfs-shell \
              --own-memory \
              --vfs-unwind \
            2>&1 | tee ci-logs/prebuild.log
          STATUS=${PIPESTATUS[0]}
          set -e

          kill "$MONITOR_PID" 2>/dev/null || true
          wait "$MONITOR_PID" 2>/dev/null || true
          trap - EXIT
          exit "$STATUS"

      - name: Upload VFS component
        uses: actions/upload-artifact@v4
        with:
          name: vfs-prebuild-component
          path: dist/vfs.component.wasm
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Upload prebuild resource logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vfs-prebuild-resource-logs
          path: ci-logs
          retention-days: 7

  postbuild:
    name: VFS postbuild
    needs: prebuild
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install wasi_virt_layer
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf \
            https://github.com/oligamiq/wasi_virt_layer/releases/download/v0.6.1/wasi_virt_layer-cli-installer.sh \
            | sh
          wasi_virt_layer --version

      - name: Install Binaryen
        run: |
          curl --fail --location --retry 3 \
            --output binaryen.tar.gz \
            "https://github.com/WebAssembly/binaryen/releases/download/${BINARYEN_VERSION}/binaryen-${BINARYEN_VERSION}-x86_64-linux.tar.gz"
          echo "${BINARYEN_SHA256}  binaryen.tar.gz" | sha256sum --check -
          tar -xzf binaryen.tar.gz
          BINARYEN_DIR="$PWD/binaryen-${BINARYEN_VERSION}"
          echo "${BINARYEN_DIR}/bin" >> "$GITHUB_PATH"
          "${BINARYEN_DIR}/bin/wasm-opt" --version

      - name: Add swap headroom
        run: |
          mkdir -p ci-logs
          free -h | tee ci-logs/memory-before-swap.txt
          swapon --show | tee -a ci-logs/memory-before-swap.txt || true
          sudo fallocate -l 16G /mnt/rubrc-ci-swapfile
          sudo chmod 600 /mnt/rubrc-ci-swapfile
          sudo mkswap /mnt/rubrc-ci-swapfile
          sudo swapon /mnt/rubrc-ci-swapfile
          free -h | tee ci-logs/memory-after-swap.txt
          swapon --show | tee -a ci-logs/memory-after-swap.txt

      - name: Download VFS component
        uses: actions/download-artifact@v4
        with:
          name: vfs-prebuild-component
          path: dist

      - name: VFS postbuild
        shell: bash
        run: |
          set -o pipefail
          (
            set +e
            while true; do
              echo "===== postbuild heartbeat $(date -u +%FT%TZ) ====="
              free -h
              ps -eo pid,ppid,comm,%cpu,%mem,rss --sort=-rss | sed -n '1,15p'
              sleep 60
            done
          ) > >(tee -a ci-logs/resources.log) 2>&1 &
          MONITOR_PID=$!
          trap 'free -h; swapon --show; kill "$MONITOR_PID" 2>/dev/null || true; exit 143' TERM INT
          trap 'kill "$MONITOR_PID" 2>/dev/null || true' EXIT

          set +e
          /usr/bin/time -v -o ci-logs/postbuild-time.txt \
            wasi_virt_layer postbuild -p dist/vfs.component.wasm \
            2>&1 | tee ci-logs/postbuild.log
          STATUS=${PIPESTATUS[0]}
          set -e

          kill "$MONITOR_PID" 2>/dev/null || true
          wait "$MONITOR_PID" 2>/dev/null || true
          trap - EXIT
          exit "$STATUS"

      - name: Summarize postbuild output
        if: always()
        run: |
          cat ci-logs/postbuild-time.txt 2>/dev/null || true
          free -h
          find dist -type f -printf '%12s %p\n' 2>/dev/null \
            | sort -nr | head -30 || true
          df -h /

      - name: Upload postbuild dist
        uses: actions/upload-artifact@v4
        with:
          name: vfs-postbuild-dist
          path: dist
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Upload postbuild resource logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vfs-postbuild-resource-logs
          path: ci-logs
          retention-days: 7

  web-build:
    name: rubrc production web build
    needs: postbuild
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Download postbuild dist
        uses: actions/download-artifact@v4
        with:
          name: vfs-postbuild-dist
          path: dist

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Complete formal production build
        run: |
          node scripts/copy_vfs_bindings.mjs
          (cd page/src/worker_process/vfs_bindings && bun install)
          bun run --cwd lib build
          bun run --cwd page build

      - name: Upload production build
        uses: actions/upload-artifact@v4
        with:
          name: rubrc-production-build
          path: page/dist
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
